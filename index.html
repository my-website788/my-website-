<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #22c55e;
    }
    button {
      background: #22c55e;
      border: none;
      padding: 12px 20px;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Welcome to My Website 🚀</h1>
  <p>This is my first real website!</p>

  <button onclick="showMessage()">Click Me</button>

  <p id="demo"></p>

  <script>
    function showMessage() {
      document.getElementById("demo").innerHTML = "🔥 You clicked the button!";
    }
  </script>

</body>
</html>
